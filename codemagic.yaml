# Codemagic 构建配置
#
# 用途：在 Codemagic 的 macOS 构建机上产出未签名 IPA，
#       绕过 GitHub Actions 被账号级禁用的问题。
#
# 说明：
#   - 本项目不需要证书。scripts/build-ipa.sh 用 CODE_SIGNING_ALLOWED=NO 编译，
#     再用 ad-hoc 签名（codesign --sign -）带上 App Groups entitlement。
#   - 因此这里不配置 ios_signing，也不需要在 Codemagic 上传 .p12 / .mobileprovision。
#   - 免费额度：500 分钟 Mac mini M2 / 月，单次构建上限 120 分钟，产物保留 30 天。

workflows:
  posterdrop-unsigned:
    name: PosterDrop — 未签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      # 默认镜像即 macOS 26.x + Xcode 26.6（iOS 26.5 SDK）。
      # 若 Codemagic 更新镜像后此值失效，改成 latest 即可。
      xcode: 26.6
      vars:
        APP_NAME: PosterDrop

    triggering:
      # 只在打 tag 时自动构建，避免每次 push 都消耗免费分钟。
      # 任何时候都可以在 Codemagic 界面点 “Start new build” 手动触发。
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: 工具链信息
        script: |
          set -e
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 XcodeGen
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        script: |
          set -e
          chmod +x scripts/*.sh
          xcodegen generate

      - name: 构建 IPA
        script: |
          set -e
          ./scripts/build-ipa.sh Release

      - name: 校验产物
        script: |
          set -e
          ls -lh build/$APP_NAME.ipa
          unzip -l build/$APP_NAME.ipa | head -n 20
          shasum -a 256 build/$APP_NAME.ipa

    # 缓存 Homebrew 下载，第二次构建可省 1–2 分钟
    cache:
      cache_paths:
        - ~/Library/Caches/Homebrew

    artifacts:
      - build/*.ipa
      - build/DerivedData/Build/Products/**/*.dSYM
