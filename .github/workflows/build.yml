name: Build IPA

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: PosterDrop

jobs:
  build:
    name: Build unsigned IPA
    # hosted 的 arm64 macOS 池容量紧张，经常排队 15 分钟也抢不到（报
    # "not acquired by Runner of type hosted"）。这不是配置错误：
    # 直接重跑同一次 workflow 就行。macos-14 / macos-15-intel 这些标签
    # 在这个账号上不可用（会报 configuration not supported），不要换。
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate project
        run: |
          chmod +x scripts/*.sh
          xcodegen generate

      - name: Build IPA
        run: ./scripts/build-ipa.sh Release

      - name: Collect dSYM
        if: always()
        run: |
          find build/DerivedData/Build/Products -name "*.dSYM" -maxdepth 3 -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PosterDrop-ipa
          path: build/PosterDrop.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: PosterDrop-dsym
          path: build/DerivedData/Build/Products/**/*.dSYM
          if-no-files-found: ignore
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PosterDrop.ipa
          fail_on_unmatched_files: true
