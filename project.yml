name: PosterDrop
options:
  bundleIdPrefix: com.posterdrop
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "20"
    # 1 = iPhone, 2 = iPad：通用 App，iPad 上支持分屏 / Stage Manager 窗口缩放。
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PosterDrop:
    type: application
    platform: iOS
    sources:
      - path: PosterDrop
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: PosterDrop
        PRODUCT_BUNDLE_IDENTIFIER: com.posterdrop.app
        INFOPLIST_FILE: PosterDrop/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO

schemes:
  PosterDrop:
    build:
      targets:
        PosterDrop: all
    run:
      config: Debug
    archive:
      config: Release
